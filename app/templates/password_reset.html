<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault API</title>
    <style>
        /* Base */
        * { box-sizing: border-box; margin: 0; padding: 0;}
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #333; }
        
        /* Navigation Bar */
        nav {background: #1a1a2e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav a {color: white;text-decoration: none; margin-left: 1rem;}
        .nav-brand { font-weight: bold; font-size: 1.2rem; }
        #nav-user, #nav-auth { display: flex; gap: 1rem; align-items: center; }

        /* Reset Password Form */
        .resetpassword-container { max-width: 400px; margin: 4rem auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);}
        .resetpassword-container h1 { margin-bottom: 1.5rem;}
        .form-row { display: flex; gap: 15px; width: 100%; }
        .form-row .form-group { flex: 1; min-width: 0; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .form-group label { margin-bottom: 5px; font-weight: 600; }
        .form-group input { width: 100%; box-sizing: border-box; }
        .form-actions { display: flex; justify-content: center; margin-top: 1.5rem; margin-bottom: 1rem; }
        button { background: #1a1a2e; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-size: 1rem;}
        button:hover {background: #16213e;}
        input { padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; width: 100%;}
        
        /* Footer */
        .email-footer { text-align: center; padding: 1rem 0; background: #1a1a2e; color: white; position: fixed; bottom: 0; width: 100%;}


    </style>
</head>
<body>
    <nav>
        <a href="/" class="nav-brand">Vault Secure</a>
        <div id="nav-links">
            <div id="nav-auth">
                <a href="/login">Login</a>
                <a href="/register">Register</a>
            </div>
        </div>
    </nav>

<main class="resetpassword-container">
    <h1>Reset Password</h1>
    <p style="color: #666; font-size: 0.9rem; margin-bottom: 1.5rem;">Enter your new password below.</p>
    
    <form id="reset-password-form">
        <div class="form-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" minlength="8" maxlength="128" required placeholder="At least 8 characters">
        </div>
        <div class="form-group">
            <label for="confirm-password">Confirm New Password</label>
            <input type="password" id="confirm-password" minlength="8" maxlength="128" required placeholder="Re-enter password">
        </div>
        <div class="form-actions">
            <button type="submit" style="width: 100%;">Update Password</button>
        </div>
    </form>
    
    <div id="reset-message" style="margin-top: 1rem; text-align: center;"></div>
</main>
<div class="email-footer">
    <p>&copy; 2026 Vault. All rights reserved.</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // Extract the token from the URL query parameters
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");
    const msg = document.getElementById("reset-message");

    if (!token) {
        msg.style.color = "#c0392b";
        msg.textContent = "Invalid or missing reset token. Please request a new password reset link.";

        document.getElementById("reset-password-form").style.display = "none";
        return;
    }
    // Handle form submission for password reset
    document.getElementById("reset-password-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const newPassword = document.getElementById("new-password").value;
        const confirmPassword = document.getElementById("confirm-password").value;

        if (newPassword !== confirmPassword) {
            msg.style.color = "#c0392b";
            msg.textContent = "Passwords do not match.";
            return;
        }

        try {
            const res = await fetch("/users/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: token, new_password: newPassword })
            });

            const data = await res.json();

            if (res.ok) {
                msg.style.color = "green";
                msg.textContent = data.message || "Password updated successfully! Redirecting to login...";
                document.getElementById("reset-password-form").reset();
                
                // Redirect user to login after 2 seconds
                setTimeout(() => {
                    window.location.href = "/login";
                }, 2000);
            } else {
                msg.style.color = "#c0392b";
                msg.textContent = data.detail || "Failed to reset password. The link may have expired.";
            }
        } catch (err) {
            msg.style.color = "#c0392b";
            msg.textContent = "An error occurred. Please try again later.";
        }
    });
});
</script>
