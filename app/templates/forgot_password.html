{% extends "base.html" %}

{% block title %}Forgot Password — Vault{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Forgot Password</h1>
    <form id="forgot-password-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-actions">
            <button type="submit">Reset Password</button>
        </div>
    </form>
</div>

<div id="message"></div>

<script>
document.getElementById("forgot-password-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const msg = document.getElementById("message");

    const res = await fetch("/users/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
    });

    if (res.ok) {
        msg.textContent = "If an account with that email exists, a password reset link will be sent.";
    } else {
        const error = await res.json();
        msg.textContent = Array.isArray(error.detail)
            ? error.detail.map(e => e.msg).join(", ")
            : error.detail || "Request failed";
    }
});
</script>
{% endblock %}
