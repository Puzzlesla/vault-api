{% extends "base.html" %}

{% block title %}Settings — Vault{% endblock %}

{% block content %}
<div class="settings-container">
    <h1>Account Settings</h1>

    <!-- Change Username -->
    <div class="settings-card">
        <h2>Change Username</h2>
            <form id="username-form">
                <div class="form-group">
                    <label for="new-username">New Username</label>
                    <input type="text" id="new-username" minlength="3" maxlength="50" required>
                </div>
            <button type="submit">Update Username</button>
        </form>
        
        <div id="username-message"></div>
    </div>

    <!-- Change Email -->
    <div class="settings-card">
        <h2>Change Email</h2>
        <form id="email-form">
            <div class="form-group">
            <label for="new-email">New Email</label>
            <input type="email" id="new-email" required>
            </div>
            <button type="submit">Update Email</button>
        
        </form>
        <div id="email-message"></div>
    </div>

    <!-- Change Password -->
    <div class="settings-card">
        <h2>Change Password</h2>
        <form id="password-form">
            <div class="form-group">
            <label for="current-password">Current Password</label>
            <input type="password" id="current-password" required>
            </div>
            <div class="form-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" minlength="8" maxlength="128" required>
            </div>
            <button type="submit">Update Password</button>
        </form>
        <div id="password-message"></div>
    </div>

    <!-- Delete Account -->
    <div class="settings-card danger-zone">
        <h2>Delete Account</h2>
        <p>This will permanently delete your account and all your notes. This cannot be undone.</p>
        <button id="delete-account-btn">Delete My Account</button>
        <div id="delete-message"></div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const token = sessionStorage.getItem("token");

    if (!token) {
        window.location.href = "/login";
        return;
    }

    // Decode JWT to get user_id (JWT payload is base64 encoded, middle section)
    const payload = JSON.parse(atob(token.split(".")[1]));
    const userId = payload.sub;

    // Change username
    document.getElementById("username-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("new-username").value;
        const msg = document.getElementById("username-message");

        const res = await fetch(`/users/${userId}`, {
            method: "PUT",
            headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ username })
        });

        if (res.ok) {
            msg.textContent = "Username updated.";
            msg.style.color = "green";
            msg.style.marginTop = "10px";
        } else {
            const error = await res.json();
            msg.textContent = error.detail || "Failed to update username.";
            msg.style.color = "red";
            msg.style.marginTop = "10px";
        }
    });

    // Change email
    document.getElementById("email-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("new-email").value;
        const msg = document.getElementById("email-message");

        if (!email) {
            msg.textContent = "Email is required.";
            msg.style.color = "red";
            msg.style.marginTop = "10px";
            return;
        }

        const res = await fetch(`/users/${userId}/email`, {
            method: "PUT",
            headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email })
        });

        if (res.ok) {
            msg.textContent = "Email updated.";
            msg.style.color = "green";
            msg.style.marginTop = "10px";
        } else {
            const error = await res.json();
            msg.textContent = error.detail || "Failed to update email.";
            msg.style.color = "red";
            msg.style.marginTop = "10px";
        }
    });

    // Change password
    document.getElementById("password-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const currentPassword = document.getElementById("current-password").value;
        const newPassword = document.getElementById("new-password").value;
        const msg = document.getElementById("password-message");

        const res = await fetch(`/users/${userId}/password`, {
            method: "PUT",
            headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                current_password: currentPassword,
                new_password: newPassword
            })
        });

        if (res.ok) {
            msg.textContent = "Password updated.";
            msg.style.color = "green";
            msg.style.marginTop = "10px";
            document.getElementById("password-form").reset();
        } else {
            const error = await res.json();
            msg.textContent = error.detail || "Failed to update password.";
            msg.style.color = "red";
            msg.style.marginTop = "10px";
        }
    });

    // Delete account
    document.getElementById("delete-account-btn").addEventListener("click", async () => {
        const confirmed = confirm(
            "Are you sure? This will permanently delete your account and all your notes."
        );
        if (!confirmed) return;

        const res = await fetch(`/users/${userId}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (res.ok) {
            sessionStorage.removeItem("token");
            window.location.href = "/register";
        } else {
            const error = await res.json();
            document.getElementById("delete-message").textContent =
                error.detail || "Failed to delete account.";
            document.getElementById("delete-message").style.color = "red";
            document.getElementById("delete-message").style.marginTop = "10px";
        }
    });
});
</script>
{% endblock %}
